[project]
name = "assistantchat-onboarding"
version = "0.1.0"
description = "FastAPI onboarding service for document management and RAGIE integration"
authors = [
    {name = "Assistant", email = "assistant@example.com"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "aioboto3>=12.0.0",
    "python-dotenv>=1.0.0",
    "injector>=0.21.0",
    "fastapi-injector>=0.5.0",
    "httpx>=0.25.0",
    "anthropic>=0.7.0",
    "ragie>=1.0.0",
    "debugpy>=1.8.0",
    "boto3>=1.35.0",
    "tavily-python>=0.7.0",
    "pillow>=11.0.0",
    "pymupdf>=1.23.0",
    "python-multipart>=0.0.20",
    "requests>=2.32.0",
    "cacheout>=0.15.0",
    "fastapi-camelcase>=2.0.0",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",  # For testing FastAPI endpoints
    "respx>=0.20.0",  # For mocking HTTP requests
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-config",
    "--strict-markers",
]
